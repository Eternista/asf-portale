<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta property="og:title" content="%SITE_NAME%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%%SITE_LOGO%" />
    <link rel="icon" href="%SITE_LOGO%" />
    <link rel="preload" as="image" href="%SITE_LOGO%" fetchpriority="high" />
    <title>%SITE_NAME%</title>
  </head>
  <body class="bg-slate-950 text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Netlify Identity: obsługa linków z zaproszeń / resetu hasła do panelu /admin -->
    <script>
      if (/(invite|recovery|confirmation)_token=/.test(window.location.hash)) {
        var s = document.createElement('script')
        s.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js'
        s.onload = function () {
          window.netlifyIdentity.on('login', function () {
            document.location.href = '/admin/'
          })
        }
        document.head.appendChild(s)
      }
    </script>
  </body>
</html>
